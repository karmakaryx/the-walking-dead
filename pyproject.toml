[project]
name = "the-walking-dead"
version = "0.1.0"
description = "A practice project for Gymnasium & MuJoCo"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "gymnasium>=1.0.0",
    "imageio>=2.37.2",
    "mujoco>=3.5.0",
    "numpy>=2.0.0",
    "stable-baselines3[extra]>=2.5.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'"
]
